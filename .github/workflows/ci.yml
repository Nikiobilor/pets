name: Build and Push to ECR

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: ${{ secrets.AWS_REGION }}

      - name: Build application and Docker images
        run: ./mvnw clean install -P buildDocker -DskipTests
        env:
          DOCKER_BUILDKIT: 1

      - name: Tag and push images to ECR
        env:
          ECR_BASE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for SERVICE in config-server discovery-server api-gateway customers-service visits-service vets-service admin-server genai-service; do
            docker tag springcommunity/spring-petclinic-${SERVICE}:latest \
              ${ECR_BASE}/spring-petclinic-${SERVICE}:${IMAGE_TAG}
            docker push ${ECR_BASE}/spring-petclinic-${SERVICE}:${IMAGE_TAG}
            echo "Pushed ${SERVICE}:${IMAGE_TAG}"
          done

      - name: Update image tag in Helm values
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s/imageTag:.*/imageTag: \"${IMAGE_TAG}\"/" helm/petclinic/values.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add helm/petclinic/values.yaml
          git commit -m "CI: update imageTag to ${IMAGE_TAG}" || echo "No changes to commit"
          git push origin HEAD:main
