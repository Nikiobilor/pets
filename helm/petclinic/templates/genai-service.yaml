apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  namespace: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genai-service
  template:
    metadata:
      labels:
        app: genai-service
    spec:
      containers:
        - name: genai-service
          image: "{{ .Values.imageRegistry }}/spring-petclinic-genai-service:{{ .Values.imageTag }}"
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:          # Read from a Kubernetes Secret (safer than plain text)
                  name: openai-secret
                  key: api-key
          resources:
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: genai-service
  namespace: petclinic
spec:
  selector:
    app: genai-service
  ports:
    - port: 8084
      targetPort: 8084
