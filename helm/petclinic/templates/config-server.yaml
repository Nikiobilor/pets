# ConfigServer must start first — all other services depend on it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: "{{ .Values.imageRegistry }}/spring-petclinic-config-server:{{ .Values.imageTag }}"
          ports:
            - containerPort: 8888
          resources:
            limits:
              memory: "{{ .Values.services.configServer.memory }}"
          readinessProbe:        # Kubernetes waits until this passes before sending traffic
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: petclinic
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
